<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> 🎯FocusTrack</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="s_css.css" />
</head>

<body class="bg">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4 text-center game-card">

      <h2 class="fw-bold mb-2">🎯 FocusTrack</h2>
      <h5 id="status">Press any key to start</h5>
       

      <div class="btn-container mt-4">
        <div class="btn-tile red" id="red"></div>
        <div class="btn-tile green" id="green"></div>
        <div class="btn-tile blue" id="blue"></div>
        <div class="btn-tile yellow" id="yellow"></div>
      </div>

    </div>
  </div>

  <script src="s_script.js"></script>
</body>
</html>
